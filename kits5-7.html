function tick(){if(!running)return;const now=Date.now();let delta=Math.max(0,(now-lastTick)/1000);lastTick=now;while(delta>0&&remaining>0){const step=Math.min(delta,section,remaining);section-=step;remaining-=step;delta-=step;if(section<0.001){section=0;if(remaining>0)advance();else stop()}}draw()}
el('start').onclick=()=>{if(remaining===0){index=0;remaining=total;section=lessons[0].seconds}if(running){tick();stop()}else{running=true;lastTick=Date.now();if(interval===null)interval=setInterval(tick,200)}draw()};el('next').onclick=()=>{if(running)tick();if(index<lessons.length-1){remaining=Math.max(0,remaining-section);index++;section=lessons[index].seconds;lastTick=Date.now()}draw()};el('back').onclick=()=>{if(running)tick();if(index>0){remaining=Math.min(total,remaining+lessons[index-1].seconds-section);index--;section=lessons[index].seconds;lastTick=Date.now()}draw()};el('reset').onclick=()=>{stop();index=0;remaining=total;section=lessons[0].seconds;draw()};draw();
