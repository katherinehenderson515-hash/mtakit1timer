<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTA Flex Day · 45-Minute Timer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#183943}body{background:repeating-linear-gradient(to bottom,#fff 0,#fff 88px,#b9e9fa 89px,#b9e9fa 92px);min-height:100dvh}.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.panel{width:min(680px,100%);text-align:center;background:#ffffffed;border:3px solid #183943;border-radius:26px;box-shadow:8px 9px 0 #18394321;padding:clamp(22px,5vw,45px)}.back{display:inline-block;text-decoration:none;color:#216d74;font-weight:800;margin-bottom:14px}h1{font-size:clamp(32px,6vw,56px);margin:0;color:#148e94}.subtitle{font-weight:700;margin:10px 0 24px}.ring{width:min(330px,70vw);aspect-ratio:1;margin:0 auto 22px;border-radius:50%;background:conic-gradient(#21bdb9 var(--progress,100%),#e4f2f3 0);padding:15px;display:grid;place-items:center}.ring-inner{background:#fff;width:100%;height:100%;border:10px solid #e8f7f7;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.time{font-size:clamp(45px,8vw,67px);font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums}.status{font-weight:800;color:#53737a;font-size:13px;letter-spacing:1px;margin-top:7px}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{cursor:pointer;border:2px solid #183943;border-radius:14px;padding:13px 25px;font-size:18px;font-weight:800;background:#92e5df;color:#183943;min-width:115px}button.secondary{background:#fff}button:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible{outline:3px solid #0a7f84;outline-offset:3px}.hint{font-size:13px;color:#53737a;margin:20px 0 0}@media(max-width:420px){.panel{padding:20px 12px}.controls{gap:8px}button{padding:12px 14px;min-width:90px;font-size:16px}}
</style><style>
.time-adjust{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:12px auto 4px;padding:8px 12px;border-radius:15px;background:#e9f4f5;max-width:570px;color:#173942;font-family:Arial,sans-serif}
.time-adjust .adjust-label{font-size:13px;font-weight:800;margin-right:4px}
.time-adjust button{cursor:pointer;background:white;color:#173942;border:2px solid #658f96;border-radius:11px;padding:9px 13px;font-size:15px;font-weight:800;min-width:74px;min-height:42px;box-shadow:none}
.time-adjust button:focus-visible{outline:3px solid #176e80;outline-offset:2px}
</style></head><body><main class="page"><section class="panel"><a class="back" href="index.html">← All lesson timers</a><h1>Flex Day</h1><p class="subtitle">45 minutes · Your lesson, your pace!</p><div class="ring" id="ring"><div class="ring-inner"><div class="time" id="clock" role="timer" aria-live="off">45:00</div><div class="status" id="status">READY</div></div></div><div class="time-adjust" aria-label="Adjust lesson position"><span class="adjust-label">Adjust lesson:</span><button type="button" id="skip5">−5 min</button><button type="button" id="skip1">−1 min</button><button type="button" id="add1">+1 min</button></div><div class="controls"><button id="start">▶ Start</button><button id="reset" class="secondary">↺ Reset</button></div><p class="hint">Pause or resume whenever you need. Reset starts a fresh 45 minutes.</p></section></main>
<script>
(()=>{'use strict';const duration=45*60*1000;let remaining=duration,running=false,deadline=0,interval=null;const clock=document.getElementById('clock'),status=document.getElementById('status'),start=document.getElementById('start'),ring=document.getElementById('ring');function render(){const secs=Math.ceil(remaining/1000);clock.textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;ring.style.setProperty('--progress',`${remaining/duration*100}%`);status.textContent=remaining===0?'TIME IS UP!':running?'COUNTING DOWN':remaining===duration?'READY':'PAUSED';start.textContent=running?'Ⅱ Pause':remaining===0?'↺ Restart':remaining===duration?'▶ Start':'▶ Resume'}function tick(){if(!running)return;remaining=Math.max(0,deadline-performance.now());if(remaining===0){running=false;clearInterval(interval);interval=null;}render()}start.addEventListener('click',()=>{if(running){tick();running=false;clearInterval(interval);interval=null;}else{if(remaining===0)remaining=duration;deadline=performance.now()+remaining;running=true;interval=setInterval(tick,100)}render()});document.getElementById('reset').addEventListener('click',()=>{running=false;clearInterval(interval);interval=null;remaining=duration;render()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});function adjust(minutes){if(running)remaining=Math.max(0,deadline-performance.now());remaining=Math.max(0,Math.min(duration,remaining+minutes*60000));if(running){deadline=performance.now()+remaining;if(remaining===0){running=false;clearInterval(interval);interval=null}}render()};document.getElementById('skip5').addEventListener('click',()=>adjust(-5));document.getElementById('skip1').addEventListener('click',()=>adjust(-1));document.getElementById('add1').addEventListener('click',()=>adjust(1));render()})();
</script></body></html>
