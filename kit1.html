const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function currentElapsed(){return Math.min(total,running?elapsed+(performance.now()-startedAt)/1000:elapsed)}
function render(){const e=currentElapsed();let i=L.length-1;for(let j=0;j<L.length;j++){if(e<starts[j]+L[j].sec){i=j;break}}const x=L[i],remaining=Math.max(0,starts[i]+x.sec-e);$('hero').style.background=x.color;$('name').textContent=x.name;$('picture').src=x.image;$('picture').alt=x.name+' MTA picture';$('part').textContent=fmt(remaining);$('master').textContent=fmt(total-e);const pct=Math.round(100*e/total);$('fill').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);[...$('steps').children].forEach((d,j)=>{d.classList.toggle('active',j===i);d.classList.toggle('done',j<i)});$('start').textContent=running?'❚❚ PAUSE':e===0?'▶ START LESSON':e>=total?'▶ START AGAIN':'▶ RESUME';$('status').textContent=e>=total?'Lesson complete!':running?'Running • '+x.name:e===0?'Ready to begin • 47-minute lesson':'Paused • '+x.name;if(e>=total&&running){running=false;elapsed=total;clearInterval(interval);interval=null}}
function stop(){if(running){elapsed=currentElapsed();running=false}clearInterval(interval);interval=null}
function start(){if(currentElapsed()>=total){elapsed=0}running=true;startedAt=performance.now();interval=setInterval(render,200);render()}
$('start').addEventListener('click',()=>{if(running){stop();render()}else start()});
$('next').addEventListener('click',()=>{const e=currentElapsed();let next=starts.find(s=>s>e+0.05);if(next===undefined)next=total;elapsed=next;if(running)startedAt=performance.now();render()});
$('back').addEventListener('click',()=>{const e=currentElapsed();let previous=0;for(const s of starts){if(s<e-0.05)previous=s;else break}elapsed=previous;if(running)startedAt=performance.now();render()});
$('reset').addEventListener('click',()=>{stop();elapsed=0;render()});render();

function seekMinutes(minutes){const e=currentElapsed();elapsed=Math.max(0,Math.min(total,e+minutes*60));if(running)startedAt=performance.now();render()}
$('skip5').addEventListener('click',()=>seekMinutes(5));$('skip1').addEventListener('click',()=>seekMinutes(1));$('add1').addEventListener('click',()=>seekMinutes(-1));
