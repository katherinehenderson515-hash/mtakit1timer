<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTA Lesson Timer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffdf9;color:#17303a;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}
h1{margin:0;font-size:clamp(26px,4vw,44px)}#master{font-size:clamp(34px,5vw,56px);font-weight:900;font-variant-numeric:tabular-nums}
.hero{margin-top:18px;border-radius:28px;padding:28px;text-align:center;background:#70b8d5;transition:.3s}
.kicker{font-weight:900;letter-spacing:.12em;font-size:14px}.name{font-size:clamp(38px,7vw,76px);font-weight:900;margin:8px}
.symbol{font-size:clamp(44px,8vw,90px);font-weight:900;min-height:100px;display:flex;align-items:center;justify-content:center}
.part{font-size:clamp(60px,12vw,120px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.progress{height:16px;background:#e5e5e5;border-radius:99px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#253b44;width:0%}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.step{background:white;border:2px solid #ddd;border-radius:14px;padding:10px 5px;text-align:center;font-size:12px;font-weight:800}.step b{display:block;font-size:22px;margin-bottom:5px}.step.active{border:4px solid #253b44;padding:8px 3px}.step.done{opacity:.38}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:14px;padding:15px 22px;min-width:130px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:#253b44;color:#fff}.secondary{background:#ececec;color:#263238}.note{text-align:center;color:#667;font-size:13px;margin-top:14px}
@media(max-width:700px){.top{display:block}.steps{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>MTA Lesson Timer</h1><div id="status">Ready to begin • 47-minute lesson</div></div><div><small><b>WHOLE LESSON</b></small><div id="master">47:00</div></div></div>
<section id="hero" class="hero"><div class="kicker">YOU SHOULD BE ON</div><div id="name" class="name">Alphabet</div><div id="symbol" class="symbol">ABC</div><div class="kicker">TIME LEFT FOR THIS PART</div><div id="part" class="part">05:00</div></section>
<div class="progress"><div id="fill" class="fill"></div></div><div id="steps" class="steps"></div>
<div class="controls"><button id="start" class="primary">▶ START LESSON</button><button id="back" class="secondary">← BACK</button><button id="next" class="secondary">NEXT →</button><button id="reset" class="secondary">↻ RESET</button></div>
<div class="note">Alphabet 5 • Reading Decks 2 • Spelling Decks 3 • New Learning 10 • Handwriting 5 • Reading 10 • Spelling 10 • Review 2</div>
</main>
<script>
const L=[
{name:"Alphabet",sec:300,color:"#70b8d5",symbol:"ABC"},
{name:"Reading Decks",sec:120,color:"#ed68a4",symbol:"▰ i"},
{name:"Spelling Decks",sec:180,color:"#a8cb43",symbol:"( ĭ )"},
{name:"New Learning",sec:600,color:"#70b8d5",symbol:"△ ?"},
{name:"Handwriting",sec:300,color:"#e1b52e",symbol:"↝ 𝓵"},
{name:"Reading",sec:600,color:"#ed68a4",symbol:"ip · tan"},
{name:"Spelling",sec:600,color:"#a8cb43",symbol:"𝓹𝓲𝓽"},
{name:"Review",sec:120,color:"#70b8d5",symbol:"↥ ?"}];
const total=L.reduce((a,x)=>a+x.sec,0), $=x=>document.getElementById(x);let i=0,part=L[0].sec,overall=total,running=false,timer=null;
L.forEach((x,n)=>{let d=document.createElement("div");d.className="step";d.innerHTML=`<b>${x.symbol}</b>${x.name}<br>${x.sec/60} min`;$("steps").appendChild(d)});
const fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")+":"+String(Math.max(0,s)%60).padStart(2,"0");
function render(){let x=L[i];$("hero").style.background=x.color;$("name").textContent=x.name;$("symbol").textContent=x.symbol;$("part").textContent=fmt(part);$("master").textContent=fmt(overall);$("fill").style.width=((total-overall)/total*100)+"%";[...$("steps").children].forEach((e,n)=>{e.classList.toggle("active",n===i);e.classList.toggle("done",n<i)});$("start").textContent=running?"❚❚ PAUSE":"▶ "+(overall===total?"START LESSON":"RESUME");$("status").textContent=overall===0?"Lesson complete!":running?"Timer running • "+x.name:"Paused / ready • "+x.name}
function advance(){if(i<L.length-1){i++;part=L[i].sec}else{overall=0;part=0;running=false;clearInterval(timer);timer=null}render()}
function tick(){if(!running)return;if(overall>0)overall--;if(part>0)part--;if(part<=0&&overall>0)advance();else render()}
$("start").onclick=()=>{running=!running;if(running&&!timer)timer=setInterval(tick,1000);render()};
$("next").onclick=()=>{if(i<L.length-1){overall=Math.max(0,overall-part);i++;part=L[i].sec;render()}};
$("back").onclick=()=>{if(i>0){i--;part=L[i].sec;overall=Math.min(total,overall+part);render()}};
$("reset").onclick=()=>{running=false;clearInterval(timer);timer=null;i=0;part=L[0].sec;overall=total;render()};render();
</script></body></html>
